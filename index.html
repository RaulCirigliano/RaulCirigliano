<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raul Cirigliano | Ingresar</title>
    <meta name="description" content="Portada de acceso al universo artístico de Raul Cirigliano.">
    <meta property="og:title" content="Raul Cirigliano | Ingresar">
    <meta property="og:description" content="Una portada visual para ingresar al sitio de Raul Cirigliano.">
    <meta property="og:image" content="imagenes/el_duende.webp">
    <meta property="og:url" content="https://raulcirigliano.com.ar/index.html">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="icon" type="image/x-icon" href="imagenes/favicon.ico">
    <link rel="shortcut icon" href="imagenes/rc.ico">
</head>

<body class="site-entry-page">
    <main class="site-entry">
        <a class="site-entry-link" href="inicio.html" aria-label="Ingresar al sitio">
            <div class="site-entry-grid" aria-hidden="true">
                <span class="entry-cell cell-a"><img src="imagenes/mujer_t_p_e.webp" alt=""></span>
                <span class="entry-cell cell-b"><img src="imagenes/el_duende.webp" alt=""></span>
                <span class="entry-cell cell-c"><img src="imagenes/mujer_flor.webp" alt=""></span>
                <span class="entry-cell cell-d"><img src="imagenes/cabeza_meishu.webp" alt=""></span>
                <span class="entry-cell cell-e"><img src="imagenes/tres.webp" alt=""></span>
                <span class="entry-cell cell-f"><img src="imagenes/el_grito_f.webp" alt=""></span>
            </div>

            <div class="site-entry-overlay"></div>

            <div class="site-entry-content">
                <p class="site-entry-kicker">Raúl Cirigliano</p>
                <h1>Arcilla, presencia y contemplación.</h1>
                <p class="site-entry-copy">
                    Una puerta de entrada al proceso, a la obra terminada y a las piezas disponibles.
                </p>
                <span class="site-entry-cta">Ingresar al sitio</span>
            </div>
        </a>
    </main>

    <script>
        (() => {
            const entryLink = document.querySelector('.site-entry-link');
            const entryGrid = document.querySelector('.site-entry-grid');

            if (!entryLink || !entryGrid) {
                return;
            }

            const updateMotion = (event) => {
                const rect = entryLink.getBoundingClientRect();
                const offsetX = event.clientX - rect.left - rect.width / 2;
                const offsetY = event.clientY - rect.top - rect.height / 2;

                entryGrid.style.setProperty('--entry-move-x', `${offsetX}px`);
                entryGrid.style.setProperty('--entry-move-y', `${offsetY}px`);
                entryLink.classList.add('is-pointer-active');
            };

            const resetMotion = () => {
                entryGrid.style.setProperty('--entry-move-x', '0px');
                entryGrid.style.setProperty('--entry-move-y', '0px');
                entryLink.classList.remove('is-pointer-active');
            };

            entryLink.addEventListener('pointermove', updateMotion);
            entryLink.addEventListener('pointerleave', resetMotion);
        })();
    </script>
</body>

</html>
