    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="tipografia.css">

<body>
    <header>
        <h1 style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;">Esfera de Arte 3D - Galería</h1>
    </header>

    <div id="c_m_scene">
        <!-- Esfera 3D -->
        <div id="c_m_sphere"></div>
        
        <!-- Controlador de rotación -->
        <div class="c_m_slider_container">
            <button id="c_m_back_btn" class="c_m_glass-btn c_m_back_btn">Volver atrás</button>
            <label for="c_m_slider" class="c_m_slider_label">Girar mundo de fotografías</label>
            <input type="range" id="c_m_slider" min="0" max="360" value="0" class="c_m_slider_input">
        </div>
    </div>
    <footer></footer>

    <div id="c_m_lightbox" class="c_m_hidden">
        <button id="c_m_close-btn" class="c_m_glass-btn">Volver al Mundo</button>
        <div class="c_m_nav-buttons">
            <button id="c_m_prev-btn" class="c_m_glass-btn c_m_nav-btn">&lt; Anterior</button>
            <button id="c_m_next-btn" class="c_m_glass-btn c_m_nav-btn">Siguiente &gt;</button>
        </div>
        <img id="c_m_lightbox-img" src="" alt="Vista expandida">
    </div>

    <script src="galeria_carrusel_mundo.js"></script>
    <script src="script.js"></script>
</body>
