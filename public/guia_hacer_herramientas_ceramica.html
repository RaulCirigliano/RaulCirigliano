<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herramientas del taller | Raul Cirigliano</title>
    <link rel="icon" type="image/x-icon" href="imagenes/rc.ico">
    <link rel="shortcut icon" href="imagenes/rc.ico">
    <meta name="description" content="Guía práctica de las herramientas más usadas en el taller de cerámica y escultura.">
    <meta property="og:title" content="Herramientas del taller | Raul Cirigliano">
    <meta property="og:description" content="Guía práctica de las herramientas más usadas en el taller de cerámica y escultura.">
    <meta property="og:image" content="https://raulcirigliano.com/imagenes/guia_hacer/herramientas.webp">
    <meta property="og:url" content="https://raulcirigliano.com/guia_hacer_herramientas_ceramica.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Raúl Cirigliano Arte">
    <link rel="canonical" href="https://raulcirigliano.com/guia_hacer_herramientas_ceramica.html">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="estilos.css">
    <link rel="stylesheet" href="tipografia.css">
    <link rel="stylesheet" href="guia_hacer.css">
</head>
<body class="guia-page workshop-typography">

    <div class="top-links">
        <a class="top-link" href="javascript:history.back()"><i class="fas fa-arrow-left"></i> Volver</a>
        <a class="top-link" href="guia_del_hacer.html"><i class="fas fa-home"></i> Guía del hacer</a>
    </div>

    <div class="guia-header">
        <h1>Herramientas del Taller</h1>
        <p>Una referencia rápida para reconocer el material y el uso de las herramientas más frecuentes.</p>
    </div>

    <div class="tools-wrapper">
        <aside class="sidebar">
            <h2 style="margin-top:0; color:var(--color-dark); font-size:1.5rem; border-bottom: 2px solid var(--color-secondary); padding-bottom: 10px; margin-bottom: 20px;">Filtros</h2>
            <input type="text" id="searchInput" class="search-box" placeholder="Buscar herramienta...">
            <button class="category-btn active" data-cat="todas">Todas</button>
            <button class="category-btn" data-cat="modelado">Modelado</button>
            <button class="category-btn" data-cat="preparacion">Preparación</button>
            <button class="category-btn" data-cat="decoracion">Decoración</button>
            <button class="category-btn" data-cat="horneado">Horneado</button>
        </aside>

        <main class="main-content">
            <div id="toolsGrid" class="grid">
                <!-- Las tarjetas de herramientas se inyectarán aquí dinámicamente por JavaScript -->
            </div>
        </main>
    </div>

    <!-- Modal para mostrar los detalles de la herramienta al hacer clic -->
    <div id="toolModal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="close-btn">&times;</button>
            <img id="modalImg" src="" alt="Imagen de herramienta">
            <h2 id="modalTitle">Nombre de la Herramienta</h2>
            <h4>Forma y Material</h4>
            <p id="modalShape">Descripción física de la herramienta.</p>
            <h4>Uso</h4>
            <p id="modalUse">Descripción de cómo y cuándo usarla.</p>
        </div>
    </div>

    <script src="guia_hacer.js"></script>
    <script src="script.js"></script>
</body>
</html>
